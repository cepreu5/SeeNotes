<!DOCTYPE html>
<html lang="bg">

<head>
    <title>CX Notes</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="NoteFav.png" />
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="CXNotes180.png">

    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self';">
    <style>
        body {
            margin: 0;
            background-color: #5c3a21;
            background-image: url('Board.png');
            font-family: sans-serif;
        }

        body:not(.app-ready) header,
        body:not(.app-ready) #add-note-fab,
        body:not(.app-ready) #scrollTopBtn,
        body:not(.app-ready) #kb-fab {
            display: none !important;
        }

        main {
            text-align: center;
        }

        #loader-container {
            text-align: center;
            margin: 50px auto;
            background-color: #fbcb39;
            padding: 2em;
            border-radius: 10px;
            box-shadow: 3px 5px 8px rgba(0, 0, 0, 0.16), 3px 5px 8px rgba(0, 0, 0, 0.23);
            display: inline-block;
            width: 300px;
            box-sizing: border-box;
        }

        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1.5s linear infinite;
            margin: 0 auto;
        }

        #loader-text {
            margin-top: 10px;
            font-size: 1.1em;
            color: #0a0a0a;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        (function () {
            var lang = localStorage.getItem('language') || (navigator.language && navigator.language.startsWith('bg') ? 'bg' : 'en');
            window.initialTranslationsPromise = fetch('lang/i18n-' + lang + '.json').then(function (r) { return r.json(); }).catch(function () { return null; });
        })();
    </script>
</head>

<body style="background-image: url('Board.png'); background-color: #5c3a21;">


    <header>
        <div style="display: flex; align-items: center;">
            <img src="MNVLogo.png" alt="Logo" class="header-logo" style="height: 60px; margin-right: 10px;">
            <div style="display: flex; flex-direction: column;">
                <h1 ID="app-title" data-key="appTitle">CX Notes</h1>
                <span id="mode-badge" data-key="localModeBadge"
                    style="font-size: 0.75em; opacity: 0.75; line-height: 1;"></span>
            </div>
        </div>
        <div id="search-wrapper">
            <input type="search" id="search-box" autocomplete="off" data-key-placeholder="searchPlaceholder">
        </div>
        <div id="header-buttons">
            <div id="note-counter" class="note-counter">0</div>
            <button id="mode_button" class="header-btn" title="Mode" data-key-title="modeButtonTooltip">
                <!-- Иконата се вмъква от JS -->
                <div class="mode-icon-wrapper">
                    <img id="mode-main-icon" src="NoteFav.png" alt="" style="width:24px; height:24px;">
                </div>
            </button>
            <button id="reload_button" class="header-btn" data-key-title="reloadButtonTooltip" title="Reload">
                <img src="Refresh.png" alt="Reload" style="width:24px; height:24px;">
            </button>
            <button id="calendar_button" class="header-btn" data-key-title="calendarButtonTooltip" title="Calendar">
                <svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <rect x="4" y="5" width="16" height="16" rx="2" />
                    <line x1="16" y1="3" x2="16" y2="7" />
                    <line x1="8" y1="3" x2="8" y2="7" />
                    <line x1="4" y1="11" x2="20" y2="11" />

                </svg>
            </button>
            <button id="settings_button" class="header-btn" data-key-title="settingsTitle" title="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
                    fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path
                        d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </button>
            <!-- FEEDBACK BUTTON 
            <a id="feedback_button" href="mailto:multinotes.web@gmail.com" class="header-btn"
                data-key-title="feedbackButtonTooltip" title="Feedback">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
            </a> -->
            <button id="install_button" class="header-btn" data-key-title="installAppTooltip" title="Install app"
                style="display: none;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <line x1="17.5" y1="3" x2="17.5" y2="10"></line>
                    <line x1="14" y1="6.5" x2="21" y2="6.5"></line>
                </svg>
            </button>
            <div id="boards-menu-container"></div>
        </div>
    </header>

    <main style="text-align: center;">
        <div id="loader-container">
            <h3 id="loader-title" style="margin-top: 0; margin-bottom: 5px;"><b><big>CX Notes</big></b></h3>
            <div id="loader-folder-info" style="font-size: 0.9em; opacity: 0.8; margin-bottom: 15px;"></div>
            <div class="loader"></div>
            <div id="loader-text"></div>
        </div>
        <div id="notes-container"></div>
        <div id="calendar-container" style="display: none;"></div>
    </main>

    <div id="folderIdPromptPopup" class="folder-id-prompt-popup">
        <div class="popup-content">
            <p data-key="promptFolderId"></p>
            <input type="text" id="folderIdInput">
            <button id="submitFolderIdBtn" data-key="submitButton" title=""></button>
        </div>
    </div>

    <!-- Note window template (b1.82): every open note is a clone of it inside #note-windows-layer.
         Inner ids live in data-mwid + .nw-<id>; only the active window carries them as real ids. -->
    <div id="content-modal-template" class="modal-overlay note-window" data-mwid="content-modal" style="display: none;">
        <div class="modal-content-box">
            <div class="modal-header-toolbar">
                <div data-mwid="modal-board-name" class="nw-modal-board-name"></div>
                <div class="modal-header-buttons">
                    <button data-mwid="prev-note-btn" class="modal-nav-btn nw-prev-note-btn" data-key-title="prevNoteTooltip"
                        title="Previous note">&lt;</button>
                    <button data-mwid="next-note-btn" class="modal-nav-btn nw-next-note-btn" data-key-title="nextNoteTooltip"
                        title="Next note">&gt;</button>
                    <button data-mwid="bullet-list-btn" class="modal-nav-btn nw-bullet-list-btn" data-key-title="bulletListTooltip"
                        title="Bulleted list" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                    </button>
                    <button data-mwid="numbered-list-btn" class="modal-nav-btn nw-numbered-list-btn" data-key-title="numberedListTooltip"
                        title="Numbered list" style="display: none;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="10" y1="6" x2="21" y2="6"></line>
                            <line x1="10" y1="12" x2="21" y2="12"></line>
                            <line x1="10" y1="18" x2="21" y2="18"></line>
                            <path d="M4 6h1v4"></path>
                            <path d="M4 10h2"></path>
                            <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path>
                        </svg>
                    </button>
                    <button data-mwid="calculate-modal-btn" class="nw-calculate-modal-btn" data-key-title="calculateTooltip" title="Calculate expression">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2"
                            stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <rect x="4" y="3" width="16" height="18" rx="2" />
                            <rect x="8" y="7" width="8" height="3" rx="1" />
                            <line x1="8" y1="14" x2="8" y2="14.01" />
                            <line x1="12" y1="14" x2="12" y2="14.01" />
                            <line x1="16" y1="14" x2="16" y2="14.01" />
                            <line x1="8" y1="17" x2="8" y2="17.01" />
                            <line x1="12" y1="17" x2="12" y2="17.01" />
                            <line x1="16" y1="17" x2="16" y2="17.01" />
                        </svg>
                    </button>
                    <button data-mwid="copy-modal-btn" class="nw-copy-modal-btn" data-key-title="copyTooltip" title="Copy content"></button>
                    <button data-mwid="paste-modal-btn" class="nw-paste-modal-btn" data-key-title="pasteFromClipboardTooltip" title="Paste from clipboard"
                        style="display: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="8" y="3" width="8" height="4" rx="1"></rect>
                            <path d="M7 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"></path>
                            <path d="M13 13h8"></path>
                            <path d="m18 9 4 4-4 4"></path>
                        </svg>
                    </button>
                    <button data-mwid="delete-modal-btn" class="nw-delete-modal-btn" data-key-title="deleteNoteTooltip" title="Delete note">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2"
                            stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <line x1="4" y1="7" x2="20" y2="7" />
                            <line x1="10" y1="11" x2="10" y2="17" />
                            <line x1="14" y1="11" x2="14" y2="17" />
                            <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
                            <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
                        </svg>
                    </button>
                    <button data-mwid="modal-expand-btn" class="modal-header-btn nw-modal-expand-btn" data-key-title="modalExpandTooltip"
                        title="Expand modal">&#9650;</button>
                    <button class="modal-close" data-key-title="closeButton" title="Close">&times;</button>
                </div>
            </div>
            <div data-mwid="modal-body" class="nw-modal-body"></div>
            <div class="modal-resize-handle"></div>
        </div>
    </div>
    <div id="note-windows-layer"></div>

    <!-- Нов, отделен модал за менюто с бордове -->
    <div id="boards-menu-modal" class="modal-overlay">
        <div class="modal-content-box">
            <button class="modal-close modal-header-btn" data-key-title="closeButton" title="Close">&times;</button>
            <div id="boards-menu-modal-body"></div>
        </div>
    </div>

    <!-- Модал за добавяне на нов борд -->
    <div id="new-board-modal" class="modal-overlay">
        <div class="modal-content-box"
            style="width: 100%; max-width: 380px; max-height: 98vh; overflow-y: auto; padding: 20px; border-radius: 15px; background: url('Frame.jpg') center/cover no-repeat; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); box-sizing: border-box; position: relative;">
            <button class="modal-close" data-key-title="closeButton" title="Close"
                style="position: absolute; top: 10px; right: 10px; font-size: 28px; background: none; border: none; cursor: pointer; color: white; z-index: 2;">&times;</button>
            <div
                style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; padding-right: 25px;">
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <h2 data-key="addBoardTitle"
                        style="margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">
                        Board</h2>

                    <button id="board-individual-order-btn" class="zoom-btn"
                        style="width: fit-content; padding: 0 10px; height: 36px; background: darkorange; color: white; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 5px;">
                        <span data-key="orderNotesBtn">Order notes</span>
                    </button>
                    <label style="color: white; font-size: 14px; display: flex; align-items: center; gap: 4px;">
                        <input type="checkbox" id="board-has-individual-order" class="settings-checkbox"
                            style="margin: 0; width: 14px; height: 14px; pointer-events: none;" readonly>
                        <span data-key="individualOrderAppliedLabel">Custom</span>
                    </label>
                </div>

                <div id="new-board-preview"
                    style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px; background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); width: fit-content; align-self: flex-start;">
                    <span id="preview-tab" class="board-filter-link"
                        style="display: inline-block; pointer-events: none; margin: 0; text-align: center; width: 112px; white-space: nowrap; border-radius: 8px 8px 0 0;"></span>
                    <div id="preview-bg"
                        style="width: 125px; height: 45px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background-size: cover; background-position: center;">
                    </div>
                </div>
            </div>
            <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                <label data-key="boardSelectLabel"
                    style="flex: 0 0 80px; font-weight: 600; color: white;">Select:</label>
                <select id="board-edit-select"
                    style="flex: 1; height: 36px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); padding: 0 5px; box-sizing: border-box; font-size: 15px; outline: none; background: rgba(255,255,255,0.15); color: white;">
                    <option value="" data-key="newBoardOption" style="background:#2c2c2c;">New board</option>
                </select>
                <button id="board-del-btn" class="zoom-btn"
                    style="padding: 0 10px; height: 36px; background: #607D8B; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 5px;">
                    <span data-key="delBoard">Delete</span>
                </button>
            </div>
            <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                <label data-key="boardTitleLabel" style="flex: 0 0 80px; font-weight: 600; color: white;">Title:</label>
                <input type="text" id="new-board-title"
                    style="flex: 1; width: 40%;height: 36px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); padding: 0 10px; box-sizing: border-box; font-size: 15px; outline: none; background: rgba(255,255,255,0.15); color: white;">
                <button id="board-reorder-btn" class="zoom-btn"
                    style="padding: 0 10px; height: 36px; background: darkorange; color: white; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 5px;">
                    <span data-key="reorderBoards">Reorder</span>
                </button>
            </div>
            <div style="margin-bottom: 15px; display: flex; align-items: flex-start; gap: 10px;">
                <div style="flex: 0 0 80px; display: flex; flex-direction: column; gap: 4px;">
                    <label data-key="boardColorLabel"
                        style="font-weight: 600; color: white; margin-top: 4px;">Color:</label>
                    <input type="text" id="new-board-custom-color" placeholder="#HEX"
                        style="width: 70px; height: 22px; font-size: 11px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: #aaa; padding: 0 5px; outline: none;">
                </div>
                <div id="new-board-colors"
                    style="flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px; background: rgba(0,0,0,0.25); border-radius: 8px;">
                    <!-- Цветове ще бъдат добавени динамично -->
                </div>
            </div>
            <div style="margin-bottom: 15px; display: flex; align-items: flex-start; gap: 10px;">
                <div style="flex: 0 0 80px; display: flex; flex-direction: column; gap: 4px;">
                    <label data-key="boardFontColorLabel"
                        style="font-weight: 600; color: white; margin-top: 4px;">Font:</label>
                    <input type="text" id="new-board-custom-font-color" placeholder="#HEX"
                        style="width: 70px; height: 22px; font-size: 11px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: #aaa; padding: 0 5px; outline: none;">
                </div>
                <div id="new-board-font-colors"
                    style="flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px; background: rgba(0,0,0,0.25); border-radius: 8px;">
                    <!-- Цветове на шрифта ще бъдат добавени динамично -->
                </div>
            </div>
            <div style="margin-bottom: 20px; display: flex; align-items: flex-start; gap: 10px;">
                <label data-key="boardBackgroundLabel"
                    style="flex: 0 0 80px; font-weight: 600; color: white; margin-top: 8px;">Background:</label>
                <div id="new-board-backgrounds"
                    style="flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 10px; background: rgba(0,0,0,0.25); border-radius: 8px;">
                    <!-- Фонове ще бъдат добавени динамично -->
                </div>
            </div>
            <input type="file" id="custom-board-bg-input" accept="image/*" style="display:none">

            <button id="save-new-board-btn" data-key="submitButton"
                style="width: 100%; height: 45px; background: darkorange; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.1s, box-shadow 0.1s;">Confirm</button>
        </div>
    </div>

    <!-- Модал за индивидуален ред на бележките в борд -->
    <div id="board-order-modal" class="modal-overlay" style="z-index: 10001;">
        <div class="modal-content-box"
            style="width: 100%; max-width: 320px; padding: 20px; border-radius: 15px; background: #333; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); position: relative;">
            <button class="modal-close" id="board-order-close" data-key-title="closeButton" title="Close"
                style="position: absolute; top: 10px; right: 10px; font-size: 28px; background: none; border: none; cursor: pointer; color: white; z-index: 2;">&times;</button>
            <h3 style="color: white; margin-top: 0; margin-bottom: 15px;" data-key="orderNotesBtn">Order Notes</h3>
            <div id="board-sort-options-container" class="sort-options-container"
                style="background: rgba(255,255,255,0.12); color: #f0f0f0; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px;">
                <!-- Ще се попълни динамично -->
            </div>

            <button id="board-order-clear-btn"
                style="width: 100%; height: 35px; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; margin-bottom: 10px;"
                data-key="clearCustomOrderBtn">Clear Custom Order</button>
            <button id="board-order-save-btn"
                style="width: 100%; height: 40px; background: darkorange; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold;"
                data-key="saveCustomOrderBtn">Save Custom Order</button>
        </div>
    </div>

    <button id="scrollTopBtn" data-key-title="topTooltip" title="To top"></button>

    <div id="toastNotification" class="toast-notification"></div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content-box set-modal" style="position: relative;">
            <h2 data-key="settingsTitle" style="margin-top: 5px; margin-bottom: 0;">Settings</h2>
            <h3 class="modal-version">CX Notes ver. </h3>
            <div style="text-align: center; margin-bottom: 3px;">
                <a href="mailto:cx.sites.online@gmail.com"
                    style="text-decoration: none; color: #555; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: bold; font-size: 0.9em;">

    <script src="main.js"></script>
    <script>
        // PWA Install Prompt
        let deferredPrompt;
        let isUIReadyForInstall = false;
        const installBtn = document.getElementById('install_button');
        const reloadBtn = document.getElementById('search-box');

        const hideInstallBtn = () => {
            if (installBtn) installBtn.style.display = 'none';
            if (reloadBtn) reloadBtn.placeholder = (typeof _ === 'function' ? _('searchPlaceholder') : '');
        };

        window.showInstallButton = () => {
            isUIReadyForInstall = true;
            if (deferredPrompt && installBtn && reloadBtn) {
                // Проверка за лимит на показванията
                /*let installPromptCount = localStorage.getItem('installPromptCount');
                if (installPromptCount === null) {
                    installPromptCount = 5;
                } else {
                    installPromptCount = parseInt(installPromptCount, 10);
                }

                if (installPromptCount <= 0 && !(typeof debug !== 'undefined' && debug)) {
                    console.log("PWA install prompt limit reached.");
                    return;
                }*/

                let rect = reloadBtn.getBoundingClientRect();
                // Ако хедърът е скрит (fullscreen mode), search-box има нулеви размери.
                // В този случай не показваме install бутона.
                if (rect.width === 0 || rect.height === 0) return;
                installBtn.style.position = 'fixed';
                installBtn.style.left = rect.left + rect.width - rect.height + 'px';
                installBtn.style.top = rect.top + 'px';
                installBtn.style.width = rect.height + 'px';
                installBtn.style.height = rect.height + 'px';
                installBtn.style.zIndex = '10001';
                installBtn.style.margin = '0';
                installBtn.style.display = 'flex';
                installBtn.style.backgroundColor = '#ff0000';
                installBtn.style.animation = 'installPulse 1.5s ease-in-out infinite';
                // Change search placeholder while install button is visible
                reloadBtn.placeholder = (typeof _ === 'function' ? _('installPromptPlaceholder') : 'Install the application');

                // Намаляваме брояча при успешно показване
                /*localStorage.setItem('installPromptCount', installPromptCount - 1);
                console.log(`PWA install button shown. Remaining displays: ${installPromptCount - 1}`);*/

                // Auto-hide after 15 seconds
                setTimeout(hideInstallBtn, 15000);
            }
        };

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Ако интерфейсът вече е зареден, показваме бутона веднага
            if (isUIReadyForInstall) {
                window.showInstallButton();
            }
        });

        // Add pulse animation - scale + color shift for maximum visibility
        if (!document.getElementById('install-btn-style')) {
            const s = document.createElement('style');
            s.id = 'install-btn-style';
            s.textContent = `
                @keyframes installPulse {
                    0%   { transform: scale(1);    background-color: #ff0000; box-shadow: 0 0 0 0 rgba(255,0,0,0.7); }
                    50%  { transform: scale(1.15); background-color: #ff4444; box-shadow: 0 0 16px 6px rgba(255,0,0,0.4); }
                    100% { transform: scale(1);    background-color: #ff0000; box-shadow: 0 0 0 0 rgba(255,0,0,0.7); }
                }
            `;
            document.head.appendChild(s);
        }

        if (installBtn) {
            installBtn.addEventListener('click', (e) => {
                hideInstallBtn();
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the A2HS prompt');
                    } else {
                        console.log('User dismissed the A2HS prompt');
                    }
                    deferredPrompt = null;
                });
            });
        }

        window.addEventListener('appinstalled', (event) => {
            console.log('App installed!');
            if (installBtn) installBtn.style.display = 'none';
        });
    </script>
