<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f4; }
        .login-box { text-align: center; background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #authorize_button { font-size: 1.2em; padding: 10px 20px; cursor: pointer; background-color: #4285F4; color: white; border: none; border-radius: 4px; }
        #authorize_button:hover { background-color: #357ae8; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>CX MultiNotes Viewer</h1>
        <p>Моля, влезте с Google, за да продължите.</p>
        <button id="authorize_button">Authorize with Google</button>
    </div>

    <script src="https://accounts.google.com/gsi/client" onload="gisLoaded()" async defer></script>
    <script type="text/javascript">
        // NOTE: Add your own Client ID here
        const CLIENT_ID = '1090128984423-80074rvs8n45v787044d9ca1bvahla98.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';
        let tokenClient;

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        const tokenWithTimestamp = {
                            ...tokenResponse,
                            issued_at: Date.now()
                        };
                        sessionStorage.setItem('google_auth_token', JSON.stringify(tokenWithTimestamp));
                        const existingFolderId = localStorage.getItem('folderId');
                        if (!existingFolderId) {
                            const folderId = prompt("Въведете Folder ID:");
                            if (folderId) {
                                localStorage.setItem('folderId', folderId);
                            }
                        }
                        window.location.href = 'index.html';
                    } else {
                        console.error('Failed to get access token');
                        alert('Authentication failed. Please try again.');
                    }
                },
            });
        }

        document.getElementById('authorize_button').addEventListener('click', () => {
            if (tokenClient) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            } else {
                console.error('Token client not initialized');
                alert('Google authentication library is not ready. Please wait a moment and try again.');
            }
        });
    </script>
</body>
</html>
