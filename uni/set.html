<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Settings & Board Menu Viewer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1f3b52;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        h2 {
            background: #e3f2fd;
            padding: 10px 15px;
            border-radius: 6px;
            color: #1565c0;
            font-size: 1.2em;
            margin-top: 30px;
        }

        .device-section {
            margin-bottom: 40px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .device-header {
            background-color: #4285F4;
            color: white;
            padding: 12px 20px;
            font-size: 1.1em;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .device-content {
            padding: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th,
        td {
            text-align: left;
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        th {
            background-color: #f8f9fa;
            width: 35%;
            color: #666;
            font-size: 0.85em;
            text-transform: uppercase;
            word-break: break-word;
        }

        @media (max-width: 500px) {
            table {
                table-layout: auto;
            }
            th,
            td {
                display: block;
                width: 100%;
                box-sizing: border-box;
            }
            th {
                border-bottom: none;
                padding-bottom: 2px;
                font-weight: bold;
            }
            td {
                padding-top: 2px;
            }
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f9f9f9;
        }

        .list-container {
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }

        ol {
            margin: 0;
            padding-left: 25px;
        }

        li {
            padding: 4px 0;
            border-bottom: 1px dashed #eee;
        }

        li:last-child {
            border-bottom: none;
        }

        .error-msg {
            color: #d93025;
            background: #fce8e6;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            width: 100%;
        }

        .json-raw {
            display: none;
            background: #272822;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85em;
            margin: 10px;
        }

        .toggle-btn {
            background: none;
            border: 1px solid white;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75em;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-left: 10px;
            color: white;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
        }

        .device-section.marked-for-delete {
            opacity: 0.5;
            filter: grayscale(1);
        }

        .device-section.marked-for-delete .device-header {
            background-color: #666 !important;
            text-decoration: line-through;
        }

        .save-container {
            position: sticky;
            top: 20px;
            z-index: 100;
            margin-bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .save-btn {
            pointer-events: auto;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .save-btn:hover {
            background-color: #2ecc71;
            transform: translateY(-2px);
        }

        .save-btn:active {
            transform: translateY(0);
        }

        .json-edit {
            width: calc(100% - 20px);
            height: 300px;
            margin: 10px;
            background: #272822;
            color: #f8f8f2;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
            border: 1px solid #444;
            display: none;
            resize: vertical;
        }
    </style>
</head>

<body>
    <div class="container" id="main-container">
        <h1>Cloud Settings & Menu Order</h1>

        <div class="save-container">
            <button id="save-all-btn" class="save-btn" style="display:none;">Запази промените</button>
        </div>

        <div id="content">Зареждане на данни...</div>

        <h2 id="saved-order-title" style="display:none;">Запазен ред в облака/локално (boardMenuOrder)</h2>
        <div id="saved-order-list" class="list-container" style="display:none;"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const contentDiv = document.getElementById('content');

            const rawSettings = sessionStorage.getItem('full_settings_json');
            const rawOrder = sessionStorage.getItem('boardMenuOrder');
            const rawBoards = sessionStorage.getItem('boardsData');

            if (!rawSettings) {
                contentDiv.innerHTML = '<div class="error-msg">Няма намерени данни в сесията. Моля, отворете настройките от главното приложение отново.</div>';
                return;
            }

            // 1. Показване на настройките по устройства
            try {
                const settings = JSON.parse(rawSettings);
                contentDiv.innerHTML = '';
                const topLevelKeys = Object.keys(settings);
                const looksOld = topLevelKeys.some(k =>
                    ['zoomLevel', 'noteFontSize', 'modalFontSize', 'startBoard'].includes(k) ||
                    k.startsWith('board_')
                );
                const devices = looksOld ? { 'Default': settings } : settings;
                const deviceNames = Object.keys(devices);
                if (deviceNames.length > 0) {
                    document.getElementById('save-all-btn').style.display = 'block';
                }

                deviceNames.forEach(deviceName => {
                    const deviceSettings = devices[deviceName];
                    const safeId = deviceName.replace(/[^\w-]/g, '-');
                    const section = document.createElement('div');
                    section.className = 'device-section';
                    section.dataset.deviceName = deviceName;
                    section.id = `section-${safeId}`;

                    const header = document.createElement('div');
                    header.className = 'device-header';
                    header.innerHTML = `
                        <div style="display:flex; align-items:center;">
                            <button class="delete-btn" onclick="toggleDelete('${safeId}')" title="Изтрий настройката">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                            </button>
                            <span style="margin-left:10px;">Настройка: ${deviceName}</span>
                        </div>
                        <button class="toggle-btn" onclick="toggleRaw('${safeId}')">JSON</button>
                    `;

                    const content = document.createElement('div');
                    content.className = 'device-content';
                    const table = document.createElement('table');

                    const keys = Object.keys(deviceSettings).sort((a, b) => {
                        const isDynamicA = a.startsWith('board_') || a.startsWith('startBoard_');
                        const isDynamicB = b.startsWith('board_') || b.startsWith('startBoard_');
                        if (isDynamicA && !isDynamicB) return 1;
                        if (!isDynamicA && isDynamicB) return -1;
                        return a.localeCompare(b);
                    });

                    keys.forEach(key => {
                        const tr = document.createElement('tr');
                        const value = deviceSettings[key];
                        let displayValue = (typeof value === 'object') ? JSON.stringify(value) : String(value);
                        tr.innerHTML = `<th>${key}</th><td>${displayValue}</td>`;
                        table.appendChild(tr);
                    });

                    const rawEdit = document.createElement('textarea');
                    rawEdit.className = 'json-edit';
                    rawEdit.id = `edit-${safeId}`;
                    rawEdit.value = JSON.stringify(deviceSettings, null, 2);

                    content.appendChild(rawEdit);
                    content.appendChild(table);
                    section.appendChild(header);
                    section.appendChild(content);
                    contentDiv.appendChild(section);
                });
            } catch (err) {
                console.error(err);
                contentDiv.innerHTML = `<div class="error-msg">Грешка при четене на настройките: ${err.message}</div>`;
            }

            document.getElementById('save-all-btn').addEventListener('click', saveAll);

            /* Секцията за текущо меню е премахната, тъй като е излишна тук */

            // 3. Показване на boardMenuOrder
            try {
                if (rawOrder) {
                    const order = JSON.parse(rawOrder);
                    const savedOrderDiv = document.getElementById('saved-order-list');
                    document.getElementById('saved-order-title').style.display = 'block';
                    savedOrderDiv.style.display = 'block';

                    if (Array.isArray(order) && order.length > 0) {
                        const ol = document.createElement('ol');
                        order.forEach(item => {
                            const li = document.createElement('li');
                            li.textContent = item;
                            ol.appendChild(li);
                        });
                        savedOrderDiv.appendChild(ol);
                    } else {
                        savedOrderDiv.textContent = 'Няма запазен ред (празен списък).';
                    }
                }
            } catch (err) {
                console.error(err);
            }
        });

        function toggleRaw(id) {
            const el = document.getElementById(`edit-${id}`);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function toggleDelete(id) {
            const section = document.getElementById(`section-${id}`);
            section.classList.toggle('marked-for-delete');
        }

        async function saveAll() {
            const sections = document.querySelectorAll('.device-section');
            const finalSettings = {};
            let hasError = false;
            sections.forEach(section => {
                if (section.classList.contains('marked-for-delete')) return;
                const deviceName = section.dataset.deviceName;
                const safeId = section.id.replace('section-', '');
                const textarea = document.getElementById(`edit-${safeId}`);
                try {
                    const editedJson = JSON.parse(textarea.value);
                    finalSettings[deviceName] = editedJson;
                } catch (e) {
                    alert(`Грешка в JSON за настройка "${deviceName}": ${e.message}`);
                    hasError = true;
                }
            });
            if (hasError) return;
            const finalContent = JSON.stringify(finalSettings, null, 2);
            sessionStorage.setItem('full_settings_json', finalContent);
            let successMsg = "Промените са запазени локално в сесията.";
            let gdriveSaved = false;
            if (window.opener && !window.opener.closed) {
                try {
                    if (typeof window.opener.updateGDriveFile === 'function') {
                        const folderId = await window.opener.getFolderIDByName('multinotes_data');
                        if (folderId) {
                            const fileName = 'settings.json';
                            const existingFiles = await window.opener.findGDFileByName(folderId, fileName);
                            if (existingFiles && existingFiles.length > 0) {
                                await window.opener.updateGDriveFile(existingFiles[0].id, finalContent);
                                successMsg = "Промените са запазени успешно в Google Drive!";
                                gdriveSaved = true;
                            }
                        }
                    } else if (typeof window.opener.saveSettingsToGDrive === 'function') {
                        console.log("Found saveSettingsToGDrive but using manual update if possible.");
                    }
                } catch (err) {
                    console.error("GDrive save error from set.html:", err);
                    successMsg += "\nГрешка при запис в Google Drive: " + err.message;
                }
            }
            if (!gdriveSaved) {
                localStorage.setItem('settings_json_full_override', finalContent);
                successMsg += "\nМоля, рестартирайте основното приложение, за да се приложат промените.";
            }
            alert(successMsg);
        }

        function getBoardColor(color) {
            const colors = ['#00FF00', '#FF0000', '#FF4500', '#FFFF00', '#00FFFF', '#FF00FF', '#3355FF'];
            if (color >= 0 && color < colors.length) return colors[color];
            if (color < 0) return '#' + (color >>> 0).toString(16).slice(-6);
            return '#ccc';
        }
    </script>
</body>

</html>
