<html>

<head>
    <meta charset="UTF-8" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f7;
            margin: 0;
            padding: 0;
        }

        .wrapper {
            width: 100%;
            background-color: #f4f4f7;
            padding: 30px 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.12);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            padding: 20px 30px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }

        .content {
            padding: 25px 30px 10px 30px;
            color: #111827;
            font-size: 15px;
            line-height: 1.6;
        }

        .content p {
            margin: 0 0 12px 0;
        }

        .highlight {
            background-color: #eff6ff;
            border-left: 4px solid #2563eb;
            padding: 10px 12px;
            border-radius: 4px;
            margin: 15px 0;
            font-size: 14px;
        }

        .footer {
            padding: 15px 30px 20px 30px;
            font-size: 12px;
            color: #6b7280;
            text-align: center;
            border-top: 1px solid #e5e7eb;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <h1>${title}</h1>
            </div>
            <div class="content">
                ${messageHtml}
            </div>
            <div class="footer">
                This is an automated message. Please do not reply directly to this email.
            </div>
        </div>
    </div>
</body>

</html>
