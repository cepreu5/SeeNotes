<style>
.frame-classic {
  background: #fff;
  border-radius: 6px;
  border: 2px solid #fff;
  outline: 1px solid #e6e6e6; /* outer edge */
  box-shadow: 0 8px 16px rgba(0,0,0,0.12);
  background-size: cover;       /* картинката да покрива целия контейнер */
  background-position: center;  /* центриране на картинката */
  display: flex;                /* за подравняване на съдържанието */
  justify-content: center;      /* хоризонтално центриране */
  align-items: center;          /* вертикално центриране */
}

.frame-gradient {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #f2f2f2;
  /* gradient rim for a bevel feel */
  box-shadow:
    0 1px 0 rgba(255,255,255,0.8) inset,
    0 -1px 0 rgba(0,0,0,0.05) inset,
    0 12px 24px rgba(0,0,0,0.12);
}

.frame-embossed {
  background: #fff;
  border: 1px solid #eee;
  border-radius: 10px;
  box-shadow:
    inset 0 2px 4px rgba(0,0,0,0.08),
    inset 0 -2px 4px rgba(255,255,255,0.6),
    0 10px 20px rgba(0,0,0,0.10);
}

.frame-bevel {
  background: #fff;
  border-radius: 8px;
  box-shadow:
    0 2px 0 #e6e6e6,        /* bottom edge */
    0 -2px 0 #ffffff,        /* top highlight */
    0 8px 16px rgba(0,0,0,0.12); /* ambient depth */
  border: 1px solid #f5f5f5;
}

.frame-soft {
  background: #fff;
  border-radius: 1px;
  box-shadow:
    8px 8px 18px rgba(0,0,0,0.12),
    -8px -8px 18px rgba(255,255,255,0.6);
}


.frame-inset {
  height: 100%;
  width: 100%;
  background-image: url('Board.png');
  background-position: center;
  
  /* без заобляне */
  border-radius: 0;

  /* рамка */
  border: 8px solid #fff;

  /* ефект на изпъкнала рамка + вдлъбната повърхност */
  box-shadow:
    0 0 0 4px #e0e0e0,               /* външен кант */
    0 6px 12px rgba(0,0,0,0.25),     /* падаща сянка за изпъкване */
    inset 0 4px 6px rgba(0,0,0,0.15),/* вътрешна сянка за вдлъбване */
    inset 0 -4px 6px rgba(255,255,255,0.6); /* горен отблясък */
  
  display: flex;
  justify-content: center;
  align-items: center;
}

.frame-cork {
  height: 99.5%;
  width: 100%;
  background: url('Board.png');

  border: 1px solid #fff;   /* бяла рамка */
  border-radius: 0;         /* прави ъгли */

  /* външна сянка за изпъкване + вътрешни тъмни сенки за вдлъбване 
  margin: 12px 12px */
  box-shadow:
    /* 0 6px 12px rgba(0,0,0,0.35),          падаща сянка за изпъкналост */
    inset 0 6px 12px rgba(0,0,0,0.45),    /* тъмна вътрешна сянка отгоре */
    inset 0 -6px 12px rgba(0,0,0,0.25);   /* тъмна вътрешна сянка отдолу */

  display: flex;
  justify-content: center;
  align-items: center;
}

</style>
<body>
	<div style="background-image: url('Board.png');" class="frame-cork">
	<h1>H E L L O!</h1>
	</div>
</body>

        <link rel="stylesheet" href="style.css">
