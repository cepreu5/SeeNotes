<!DOCTYPE html>
<html lang="bg">
<head>
    <title>CX Viewer</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="NoteFav.png" />
    <link rel="stylesheet" href="style.css">
    <style>
        /* ... съществуващ CSS ... */
        /* Login Modal Styles */
        .login-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            text-align: center;
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            min-width: 300px;
        }
        #authorize_button { font-size: 1.2em; padding: 10px 20px; cursor: pointer; background-color: #4285F4; color: white; border: none; border-radius: 4px; }
        #authorize_button:hover { background-color: #357ae8; }
        #lang-switcher { display: flex; justify-content: center; margin-bottom: 20px; }
        .lang-btn { background: none; border: 1px solid #ccc; color: #333; padding: 5px 10px; cursor: pointer; font-size: 0.9em; }
        .lang-btn:first-child { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
        .lang-btn:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; border-left: none; }
        .lang-btn.active { background-color: #4285F4; color: white; border-color: #4285F4; }
    </style>
</head>
<body>
    <header>
        <h1 data-key="appTitle">CX MultiNotes Viewer</h1>
        <div id="search-wrapper">
            <input type="search" id="search-box" data-key-placeholder="searchPlaceholder" placeholder="Търсене в заглавията...">
        </div>
        <div id="header-buttons">
            <div id="note-counter" class="note-counter">0</div>
            <button id="settings_button" class="header-btn" data-key-title="settingsTitle" title="Настройки">
                <!-- SVG icon will be inserted by JS -->
            </button>
            <button id="reload_button" class="header-btn" data-key-title="reloadButtonTooltip" title="Презареди">
                <img src="Refresh.png" alt="Reload" style="width:24px; height:24px;">
            </button>
            <button id="signout_button" class="header-btn" data-key-title="signoutButtonTooltip" title="Изход">
                <img src="Logout.png" alt="Logout" style="width:24px; height:24px;">
            </button>
        </div>
    </header>

    <main>
        <div id="loader-container" style="display: none;">
            <div class="loader"></div>
            <div id="loader-text"></div>
        </div>
        <div id="notes-container"></div>
        <div id="calendar-container" style="display: none;"></div>
    </main>

    <div id="folderIdPromptPopup" class="folder-id-prompt-popup">
        <div class="popup-content">
            <p data-key="promptFolderId"></p>
            <input type="text" id="folderIdInput" data-key-placeholder="folderIdInputPlaceholder">
            <button id="submitFolderIdBtn" data-key="submitButton" title=""></button>
        </div>
    </div>

    <div id="content-modal" class="modal-overlay">
        <div class="modal-content-box">
            <div id="modal-board-name"></div>
            <button id="copy-modal-btn" class="modal-header-btn" data-key-title="copyTooltip" title="Копирай съдържанието"></button>
            <button class="modal-close modal-header-btn">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <button id="scrollTopBtn" data-key-title="topTooltip" title="Към началото"></button>

    <div id="toastNotification" class="toast-notification"></div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content-box set-modal">
            <h2 data-key="settingsTitle">Настройки</h2>
            <h3 class="modal-version">CX MultiNotes Viewer ver. </h3>
            <button class="modal-close modal-header-btn">&times;</button>
            <div class="corner-dot top-left"></div>
            <div class="corner-dot top-right"></div>
            <div class="corner-dot bottom-left"></div>
            <div class="corner-dot bottom-right"></div>
            <div id="settings-modal-body">
                <!-- Settings content starts here -->
                <div class="zoom-control-wrapper">
                    <label for="scaleSlider" data-key="zoomLabel">Мащаб</label>
                    <div class="slider-container">
                        <input type="range" id="scaleSlider" min="25" max="175" value="100">
                        <input type="number" id="scaleInput" min="25" max="175" class="zoom-input-number">
                        <span>%</span>
                    </div>
                    <button id="applyZoomBtn" class="zoom-btn" data-key="submitButton">Приложи</button>
                </div>

                <div class="zoom-control-wrapper" style="margin-top: 20px;">
                    <label for="start-board-select" data-key="startBoardLabel">Начална дъска</label>
                    <select id="start-board-select" class="start-board-select">
                        <option value="all" data-key="allBoards">Всички</option>
                        <option value="calendar" data-key="calendar">Календар</option>
                        <option value="reminder" data-key="reminder">Напомняния</option>
                        <!-- Board options will be populated by JS -->
                    </select>
                </div>

                <div class="zoom-control-wrapper" style="margin-top: 20px;">
                    <label for="max-searches-input" data-key="maxSearchesLabel">Запомни последни търсения</label>
                    <input type="number" id="max-searches-input" class="zoom-input-number" min="0" max="20">
                </div>

                <div class="zoom-control-wrapper" style="margin-top: 15px;">
                    <label for="note-font-size-input" data-key="noteFontSizeLabel" style="flex-basis: 200px; flex-shrink: 0; text-align: left;">Размер на шрифта на бележките</label>
                    <select id="note-font-size-input" class="zoom-input-select" style="width: 80px; margin: 0 2px 0 10px; flex-shrink: 0;"></select>
                </div>

                <div class="zoom-control-wrapper" style="margin-top: 15px;">
                    <label for="modal-font-size-input" data-key="modalFontSizeLabel" style="flex-basis: 200px; flex-shrink: 0; text-align: left;">Размер на шрифта в модала</label>
                    <select id="modal-font-size-input" class="zoom-input-select" style="width: 80px; margin: 0 2px 0 10px; flex-shrink: 0;"></select>
                </div>

                <div class="zoom-control-wrapper" style="margin-top: 20px;">
                    <label for="show-datemod-checkbox" data-key="showDatemodLabel">Покажи дата на модификация</label>
                    <input type="checkbox" id="show-datemod-checkbox" class="settings-checkbox">
                </div>

                <div class="zoom-control-wrapper" style="margin-top: 20px;">
                    <label for="use-local-db-checkbox" data-key="useLocalDbLabel">Използвай локална база данни</label>
                    <input type="checkbox" id="use-local-db-checkbox" class="settings-checkbox">
                </div>

                <div id="update-db-options-wrapper">
                    <div class="zoom-control-wrapper" style="margin-top: 20px;">
                        <label data-key="updateLocalDbTitle">Актуализиране на локалната база данни:</label>
                    </div>

                    <div class="zoom-control-wrapper" style="padding-left: 20px;">
                        <label for="update-indexed-db-checkbox" data-key="updateIndexedDbLabel">Актуализиране от локален диск</label>
                        <input type="checkbox" id="update-indexed-db-checkbox" class="settings-checkbox">
                    </div>

                    <div class="zoom-control-wrapper" style="padding-left: 20px;">
                        <label for="update-from-gdrive-checkbox" data-key="updateFromGoogleDriveLabel">Актуализиране от Google Drive</label>
                        <input type="checkbox" id="update-from-gdrive-checkbox" class="settings-checkbox">
                    </div>
                </div>

                <div class="zoom-control-wrapper" style="margin-top: 20px;">
                    <label data-key="localSyncFolderLabel">Папка за локална синхронизация</label>
                    <button id="select-folder-btn" class="zoom-btn" data-key="selectFolderButton">Избери папка</button>
                    <span id="local-sync-folder-name" style="margin-left: 10px; font-style: italic; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
                </div>

                <div class="settings-close-btn-wrapper">
                    <button id="settings-close-btn" class="zoom-btn settings-close-btn" data-key="closeButton">Затвори</button>
                </div>
                <!-- Settings content ends here -->
            </div>
        </div>
    </div>

    <svg width="0" height="0" style="position:absolute">
        <defs>
            <symbol id="icon-arrow-left" viewBox="0 0 24 24">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </symbol>
            <symbol id="icon-arrow-right" viewBox="0 0 24 24">
                <path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/>
            </symbol>
        </defs>
    </svg>

    <!-- LOGIN MODAL (скрит по подразбиране) -->
    <div id="loginModal" class="login-modal-overlay" style="display: none;">
        <div class="login-box">
            <div id="lang-switcher">
                <button id="lang-bg" class="lang-btn">BG</button>
                <button id="lang-en" class="lang-btn">EN</button>
            </div>
            <h1 data-key="appTitle">CX MultiNotes Viewer</h1>
            <p data-key="loginPrompt">Моля, влезте с Google, за да продължите.</p>
            <button id="authorize_button" data-key="authorizeButton" disabled>Authorize with Google</button>
        </div>
        <script src="https://accounts.google.com/gsi/client" onload="gisLoaded()" async defer></script>
    </div>

    <script>
    // --- I18N ---
    const translationsl = {
        en: {
            appTitle: 'CX MultiNotes Viewer',
            loginPrompt: 'Please sign in with Google to continue.',
            authorizeButton: 'Authorize with Google',
            authFailed: 'Authentication failed. Please try again.',
            gapiNotReady: 'Google authentication library is not ready. Please wait a moment and try again.'
        },
        bg: {
            appTitle: 'CX MultiNotes Viewer',
            loginPrompt: 'Моля, влезте с Google, за да продължите.',
            authorizeButton: 'Вход с Google',
            authFailed: 'Удостоверяването не бе успешно. Моля, опитайте отново.',
            gapiNotReady: 'Библиотеката за удостоверяване на Google не е готова. Моля, изчакайте малко и опитайте отново.'
        }
    };
    let currentLangL = localStorage.getItem('language') || 'bg';
    
    let tokenClient; // Declare tokenClient in the script's global scope

    function _login(key) { return translationsl[currentLangL][key] || key; }

    function setLoginLanguage(lang) {
        if (!translationsl[lang]) return;
        currentLangL = lang;
        localStorage.setItem('language', lang);
        
        const loginModal = document.getElementById('loginModal');
        loginModal.querySelectorAll('[data-key]').forEach(element => {
            const key = element.getAttribute('data-key');
            element.textContent = _login(key);
        });
        document.getElementById('authorize_button').textContent = _login('authorizeButton');
        document.getElementById('lang-bg').classList.toggle('active', lang === 'bg');
        document.getElementById('lang-en').classList.toggle('active', lang === 'en');
    }

    // --- Google OAuth ---
    function gisLoaded() {
        const CLIENT_ID = '1090128984423-80074rvs8n45v787044d9ca1bvahla98.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.readonly email';
        
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPES,
            callback: async (tokenResponse) => {
                if (tokenResponse && tokenResponse.access_token) {
                    const tokenWithTimestamp = { ...tokenResponse, issued_at: Date.now() };
                    sessionStorage.setItem('google_auth_token', JSON.stringify(tokenWithTimestamp));
                    window.location.reload(); // Reload the page to start the app
                } else {
                    console.error('Failed to get access token');
                    alert(_login('authFailed'));
                }
            },
        });
        document.getElementById('authorize_button').disabled = false;
    }

    function handleAuthClick() {
        if (tokenClient) {
            tokenClient.requestAccessToken({ prompt: 'consent' });
        } else {
            console.error('Token client not initialized. gisLoaded() may not have run.');
            alert(_login('gapiNotReady'));
        }
    }

    // Initial language setup and event listeners for the modal
    document.addEventListener('DOMContentLoaded', () => {
        // SHOW LOGIN MODAL IF NOT LOGGED IN
        if (!sessionStorage.getItem('google_auth_token')) {
            document.getElementById('loginModal').style.display = 'flex';
            setLoginLanguage(currentLangL);
        }

        document.getElementById('authorize_button').addEventListener('click', handleAuthClick);
        document.getElementById('lang-bg').addEventListener('click', () => setLoginLanguage('bg'));
        document.getElementById('lang-en').addEventListener('click', () => setLoginLanguage('en'));
    });
    </script>

    <!-- ... останалите viewer скриптове ... -->
    <script src="config.js"></script>
    <script src="auth-l.js"></script>
    <script src="drive-api.js"></script>
    <script src="local-data.js"></script>
    <script src="ui.js"></script>
    <script src="main.js"></script>
</body>
</html>
