<style>
.mode-group {
  margin-top: 15px;

  border: 1px solid #ccc;
  border-radius: 6px;
  background-color: #f9f9f9;
}

.mode-label {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 500;
  cursor: pointer;
  margin-bottom: 8px;
}

.mode-icon {
  font-size: 20px;
  flex-shrink: 0;
}

.mode-text {
  font-size: 16px;
}

.mode-suboptions {
  padding-left: 30px;
  display: none;
}

.folder-name {
  margin-left: 10px;
  font-style: italic;
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: inline-block;
  vertical-align: middle;
}

/* Основна структура */
.settings-section {
  margin-top: 20px;
}

.mode-group {
  margin-top: 15px;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background-color: #f9f9f9;
}

.mode-label {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 500;
  cursor: pointer;
  margin-bottom: 8px;
}

.mode-icon svg {
  display: block;
}

.settings-radio {
  margin: 0;
  transform: scale(1.3);
}

.mode-text {
  font-size: 17px;
}

.mode-suboptions {
  padding-left: 40px;
  display: none;
}

.folder-name {
  margin-left: 10px;
  font-style: italic;
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: inline-block;
  vertical-align: middle;
}

/* SVG икона */
.mode-icon svg {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
}

/* Радио бутон */
.settings-radio {
  margin: 0;
  transform: scale(1.3);
}

/* Текст до радио бутона */
.mode-text {
  font-size: 17px;
}

/* Подопции */
.mode-suboptions {
  padding-left: 40px;
  display: none;
}

/* Responsive адаптация */
@media (max-width: 768px) {
  .mode-label {
    gap: 8px;
  }

.mode-icon svg {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  display: block;
}

  .mode-text {
    font-size: 16px;
  }

  .mode-suboptions {
    padding-left: 20px;
  }
}

@media (max-width: 480px) {
  .mode-label {
    flex-direction: row;
    align-items: flex-start;
  }

  .mode-icon svg {
    width: 24px;
    height: 24px;
  }

  .mode-text {
    font-size: 15px;
  }

  .settings-radio {
    transform: scale(1.1);
  }

  .mode-suboptions {
    padding-left: 15px;
  }
}

</style>

<div class="settings-section">
  <h4 data-key="modesTitle" style="margin-top: 20px;">Режим на работа</h4>

  <div class="mode-group">
    <label class="mode-label" for="mode-gdrive">
      <span class="mode-icon">
        <!-- Оригинален Google Drive SVG -->
<span class="mode-icon">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <path fill="#fbbc05" d="M160 32L0 320l96 160 160-288z"/>
    <path fill="#34a853" d="M96 480h320l96-160H256z"/>
    <path fill="#4285f4" d="M352 32H160l160 288h192z"/>
  </svg>
</span>
      </span>
      <input type="radio" id="mode-gdrive" name="work-mode" value="gdrive" class="settings-radio">
      <span class="mode-text">Google Drive</span>
    </label>
    <div id="gdrive-settings-wrapper" class="mode-suboptions">
      <div class="zoom-control-wrapper">
        <label for="use-local-db-checkbox" data-key="useLocalDbLabel">Използвай локална база данни</label>
        <input type="checkbox" id="use-local-db-checkbox" class="settings-checkbox">
      </div>
      <div class="zoom-control-wrapper">
        <label for="update-from-gdrive-checkbox" data-key="updateFromGoogleDriveLabel">Актуализиране от Google Drive</label>
        <input type="checkbox" id="update-from-gdrive-checkbox" class="settings-checkbox">
      </div>
    </div>
  </div>

  <div class="mode-group">
    <label class="mode-label" for="mode-local">
      <span class="mode-icon">
        <!-- Стилизирана локална папка SVG -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#F4B400" d="M10 4H2v16h20V6H12l-2-2z"/>
          <path fill="#E2A700" d="M2 6h20v2H2z"/>
        </svg>
      </span>
      <input type="radio" id="mode-local" name="work-mode" value="local" class="settings-radio">
      <span class="mode-text">Локална папка</span>
    </label>
    <div id="local-folder-settings-wrapper" class="mode-suboptions">
      <div class="zoom-control-wrapper">
        <label data-key="localSyncFolderLabel">Папка за локална синхронизация</label>
        <button id="select-folder-btn" class="zoom-btn" data-key="selectFolderButton">Избери папка</button>
        <span id="local-sync-folder-name" class="folder-name"></span>
      </div>
      <div class="zoom-control-wrapper">
        <label for="update-indexed-db-checkbox" data-key="updateIndexedDbLabel">Актуализиране от локален диск</label>
        <input type="checkbox" id="update-indexed-db-checkbox" class="settings-checkbox">
      </div>
    </div>
  </div>
</div>

<script>
const gdriveRadio = document.getElementById('mode-gdrive');
const localRadio = document.getElementById('mode-local');
const gdriveSettings = document.getElementById('gdrive-settings-wrapper');
const localSettings = document.getElementById('local-folder-settings-wrapper');

function updateModeVisibility() {
  if (gdriveRadio.checked) {
    gdriveSettings.style.display = 'block';
    localSettings.style.display = 'none';
    localStorage.setItem('selectedWorkMode', 'gdrive');
  } else if (localRadio.checked) {
    gdriveSettings.style.display = 'none';
    localSettings.style.display = 'block';
    localStorage.setItem('selectedWorkMode', 'local');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const savedMode = localStorage.getItem('selectedWorkMode');
  if (savedMode === 'local') {
    localRadio.checked = true;
  } else {
    gdriveRadio.checked = true;
  }
  updateModeVisibility();
});

gdriveRadio.addEventListener('change', updateModeVisibility);
localRadio.addEventListener('change', updateModeVisibility);
</script>
