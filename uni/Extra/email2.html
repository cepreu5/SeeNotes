<html>

<head>
    <meta charset="UTF-8" />
    <style>
        body {
            margin: 0;
            padding: 40px 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .note-wrapper {
            width: 100%;
            text-align: center;
        }

        .note {
            display: inline-block;
            background: #fff9a9;
            width: 320px;
            padding: 25px;
            padding-top: 45px;
            border-radius: 6px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
            position: relative;
            transform: rotate(-2deg);
            font-size: 15px;
            line-height: 1.5;
        }

        .note:before {
            content: "";
            width: 26px;
            height: 26px;
            background: #d62828;
            border-radius: 50%;
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.4);
        }

        .note h1 {
            margin-top: 0;
            font-size: 20px;
            text-align: center;
            color: #333;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #555;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="note-wrapper">
        <div class="note">
            <h1>{{TITLE}}</h1>
            {{MESSAGE}}
        </div>

        <div class="footer">
            This is an automated message. Please do not reply.
        </div>
    </div>
</body>

</html>
