<!DOCTYPE html>
<html lang="bg">
<head>
    <title data-key="appTitle">Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="NoteFav.png" />
    <style>
        /* Скриваме кутията за вход по подразбиране, за да избегнем "премигване" */
        .login-box {
            visibility: hidden;
        }
        body { 
            font-family: sans-serif; 
            margin: 0; 
            background-image: url('Board.png'); 
            height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto; /* Header, Main Content, Footer */
            place-items: center; /* Center items horizontally */
        }
        /* Центрираме панела за вход вертикално под хедъра */
        header {
            width: 100%;
            padding: 1em;
            padding-bottom: 0.3em;
            display: flex;
            justify-content: flex-start; /* Align title to the left */
            align-items: center;
            background-image: url('Frame.jpg');
            box-sizing: border-box;
            position: relative; /* Необходимо за позициониране на съобщението */
        }
        header h1 {
            margin: 0;
            text-shadow: 2px 3px 5px rgba(0, 0, 0, 0.5);
        }

        .login-box { margin-top: 100px; } /* Place login box in the main content area */

        .login-box { text-align: center; background: #FBCB39; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        #authorize_button { 
            font-size: 1.2em; padding: 10px 20px; cursor: pointer; background-color: #4285F4; 
            color: white; border: none; border-radius: 4px;
        }

        #authorize_button:hover { background-color: #357ae8; }

        #lang-switcher {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .lang-btn {
            background: none;
            border: 1px solid #747474;
            color: #333;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .lang-btn:first-child {
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
        }

        .lang-btn:last-child {
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
            border-left: none;
        }

        .lang-btn.active {
            background-color: #4285F4;
            color: white;
            border-color: #4285F4;
        }

        .settings-checkbox {
            transform: scale(1.2);
            vertical-align: middle;
        }

        /* Медийна заявка за тесни екрани (мобилни устройства) */
        @media (max-width: 768px) {
            header {
                flex-direction: column; /* Подреждаме заглавието и съобщението едно под друго */
                gap: 5px; /* Добавяме малко разстояние между тях */
            }
            #silent-login-message {
                position: static; /* Премахваме абсолютното позициониране */
                transform: none; /* Премахваме трансформацията */
            }
        }
    </style>
</head>
<body>
    <header>
        <h1 data-key="appTitle">CX MultiNotes Viewer</h1>
    </header>

    <div class="login-box">
        <div id="lang-switcher">
            <button id="lang-bg" class="lang-btn">BG</button>
            <button id="lang-en" class="lang-btn">EN</button>
        </div>
        <p data-key="loginPrompt">Моля, влезте с Google, за да продължите.</p>
        <button id="authorize_button" data-key="authorizeButton" disabled>Authorize with Google</button>
        <div style="margin-top: 15px;">
            <label for="rememberMe" style="margin-right: 0px;" data-key="rememberMeLabel">
                Запомни ме</label>
            <input type="checkbox" id="rememberMe" class="settings-checkbox">
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" onload="gisLoaded()" async defer></script>
    <script type="text/javascript">

        const main = 'index.html';
        const version = '0.15';

        // --- I18N ---
        const translations = {
            en: {
                appTitle: 'CX MultiNotes Viewer',
                loginPrompt: 'Please sign in with Google to continue.',
                authorizeButton: 'Authorize with Google',
                rememberMeLabel: 'Remember me',
                authFailed: 'Authentication failed. Please try again.',
                gapiNotReady: 'Google authentication library is not ready. Please wait a moment and try again.'
            },
            bg: {
                appTitle: 'CX MultiNotes Viewer',
                loginPrompt: 'Моля, влезте с Google, за да продължите.',
                authorizeButton: 'Вход с Google',
                rememberMeLabel: 'Запомни ме',
                authFailed: 'Удостоверяването не бе успешно. Моля, опитайте отново.',
                gapiNotReady: 'Библиотеката за удостоверяване на Google не е готова. Моля, изчакайте малко и опитайте отново.'
            }
        };
        let currentLang = localStorage.getItem('language') || 'bg'; // Get from localStorage or default to bg

        function setLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;
            localStorage.setItem('language', lang);
            document.documentElement.lang = lang; // Set lang attribute on html tag

            document.querySelectorAll('[data-key]').forEach(element => {
                const key = element.getAttribute('data-key');
                // --- КОРЕКЦИЯ: Добавяме версията към главното заглавие ---
                if (key === 'appTitle' && element.tagName === 'H1') {
                    element.textContent = `${_(key)} ver. ${version}`;
                } else {
                    element.textContent = _(key);
                }
            });

            // document.title = `${_('appTitle')} v${version}`; // Update page title with version

            // Update active button
            document.getElementById('lang-bg').classList.toggle('active', lang === 'bg');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
        }

        function _(key) {
            return translations[currentLang][key] || key;
        }

        // NOTE: Add your own Client ID here
        const CLIENT_ID = '1090128984423-80074rvs8n45v787044d9ca1bvahla98.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.readonly email';
        let tokenClient;

        function decodeJwtResponse(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: async (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        const tokenWithTimestamp = { ...tokenResponse, issued_at: Date.now() };
                        const rememberMe = document.getElementById('rememberMe')?.checked;
                        // Токенът се записва в localStorage или sessionStorage според избора
                        const storage = rememberMe ? localStorage : sessionStorage;
                        storage.setItem('google_auth_token', JSON.stringify(tokenWithTimestamp));
                        try {
                            const userInfoResponse = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                                headers: { 'Authorization': `Bearer ${tokenResponse.access_token}` }
                            });
                            if (userInfoResponse.ok) {
                                const userInfo = await userInfoResponse.json();
                                // Имейлът за текущата сесия се записва ВИНАГИ в sessionStorage
                                sessionStorage.setItem('google_auth_email_hint', userInfo.email);
                                // Запазваме имейла за следващо "тихо" влизане
                                localStorage.setItem('google_login_hint', userInfo.email);
                            }
                        } catch (error) {
                            console.error('Failed to fetch user info:', error);
                        }
                        sessionStorage.removeItem('logout_flag');
                        window.location.href = main;
                    } else {
                        console.error('Failed to get access token');
                        alert(_('authFailed'));
                    }
                },
                error_callback: (error) => {
                    console.error("GSI Error:", error);
                    alert(_('authFailed') + `\n\nError: ${error.type}`);
                }
            });

            const loginBox = document.querySelector('.login-box');
            const loginHint = localStorage.getItem('google_login_hint'); // Взимаме запазения имейл
            const rememberMe = document.getElementById('rememberMe');

            // --- КОРЕКЦИЯ: Проверяваме и дали "Запомни ме" е било избрано ---
            if (loginHint && rememberMe.checked) {
                // Опитваме "тихо" влизане със запазения имейл
                // Успешният резултат ще се обработи от глобалния callback.
                // Проваленият опит ще се обработи от error_callback, но за prompt: 'none' той не прави нищо,
                // което ни позволява да покажем ръчно екрана за вход.
                tokenClient.requestAccessToken({ prompt: 'none', login_hint: loginHint, error_callback: () => {
                    // Ако "тихото" влизане се провали,
                    // и показваме стандартния екран за вход.
                    loginBox.style.visibility = 'visible';
                    document.getElementById('authorize_button').disabled = false;
                }});
            } else {
                // Ако няма запазен login_hint или потребителят е излязъл изрично,
                // показваме екрана за вход веднага.
                loginBox.style.visibility = 'visible';
                document.getElementById('authorize_button').disabled = false;
            }
        }

        // --- КОРЕКЦИЯ: Зареждаме състоянието на "Запомни ме" при стартиране ---
        document.addEventListener('DOMContentLoaded', () => {
            const rememberMeCheckbox = document.getElementById('rememberMe');
            rememberMeCheckbox.checked = localStorage.getItem('rememberMe') === 'true';
        });

        function handleAuthClick() {
            if (tokenClient) {
                // --- Опростена логика ---
                // След като disableAutoSelect() е извикана при изход, вече не е нужно
                // да се борим с кеширания потребител тук. Просто искаме токен.
                tokenClient.requestAccessToken({ prompt: 'select_account' });
            } else {
                console.error('Token client not initialized');
                alert(_('gapiNotReady'));
            }
        }

        // Initial language setup and event listeners
        document.addEventListener('DOMContentLoaded', () => {
            setLanguage(currentLang);
            document.getElementById('authorize_button').addEventListener('click', handleAuthClick);
            document.getElementById('lang-bg').addEventListener('click', () => setLanguage('bg'));
            document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));

            // Запазваме състоянието на "Запомни ме" при промяна
            const rememberMeCheckbox = document.getElementById('rememberMe');
            rememberMeCheckbox.addEventListener('change', () => {
                localStorage.setItem('rememberMe', rememberMeCheckbox.checked);
            });
        });
    </script>
